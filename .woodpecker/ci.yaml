when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: verify
    image: node:22-bookworm
    commands:
      - npm i -g pnpm@11
      - pnpm install --frozen-lockfile
      - pnpm run verify

  - name: deploy
    image: curlimages/curl
    when:
      - event: push
        branch: main
    environment:
      COOLIFY_TOKEN:
        from_secret: coolify_token
      COOLIFY_URL:
        from_secret: coolify_url
    commands:
      - 'curl -fsS -X POST -H "Authorization: Bearer $$COOLIFY_TOKEN" "$$COOLIFY_URL/api/v1/deploy?uuid=p1yng8mfa3wf3tv82wa8dzdd"'
