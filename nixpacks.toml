# Coolify / Nixpacks: evita comandos vacíos (bash -c sin argumento).
# Deja en Coolify los campos "Custom build/start" vacíos o bórralos para que use esto.
# Astro 7 exige Node >=22.12; el archive por defecto de Nixpacks trae 22.11.

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm run build"]

# Sin flag -s: sitio multipágina (/privacy/, /terms/, /oauth/instagram/…);
# start = `node scripts/serve.mjs` (GET estático + POST 200 en deauthorize/data-deletion).
[start]
cmd = "pnpm run start"
